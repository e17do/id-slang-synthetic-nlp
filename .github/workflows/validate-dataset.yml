name: Validate Dataset

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-dataset:
    name: Validate Indonesian Slang Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate JSON syntax
        run: |
          python -m json.tool dataset/dataset_slang_indonesia.json > /dev/null

      - name: Run dataset validator
        run: |
          python validation/validator.py

      - name: Run quality audit
        run: |
          python quality/audit.py

      - name: Upload audit summary
        uses: actions/upload-artifact@v6
        with:
          name: audit-summary
          path: reports/audit_summary.json

      - name: Upload quality report
        uses: actions/upload-artifact@v6
        with:
          name: dataset-quality-report
          path: reports/dataset_quality_report.json

      - name: Show quality report
        run: |
          cat reports/dataset_quality_report.json
